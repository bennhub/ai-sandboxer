<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="viewport"

    <script src="https://cdn.tailwindcss.com"></script>

    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai",

    <!-- CSS STYLES -->
    <style>
      /* Base Layout */
      .layout-container {
        height: 100vh;
        overflow: hidden;
        padding: 1rem;
      }

      .split-horizontal {
        display: flex;
        height: calc(100% - 4rem); /* Account for header */
      }

      .split-vertical {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* Panel Styles */
      .panel {
        overflow: hidden;
        background: #f8f9fa;
        border-radius: 0.5rem;
        margin: 0.25rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      #editor-panel,
      #preview-panel {
        height: 100%;
      }

      #editor {
        width: 100%;
        height: 100%;
        border-radius: 0.5rem;
      }

      #preview {
        width: 100%;
        height: 100%;
        border-radius: 0.5rem;
        border: 2px solid #e5e7eb;
        background-color: white;
      }

      #prompt-panel {
        padding: 1rem;
        background-color: white;
      }

      #ai-chat {
        height: 100%;
        overflow-y: auto;
        background-color: white;
        padding: 1rem;
        border-radius: 0.5rem;
      }

      /* Button Styles */
      .button-base {
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
      }

      .button-base:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .button-base:active {
        transform: translateY(0px) scale(0.98);
      }

      .button-base:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      /* Spinner Animation */
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid #ffffff;
        border-top: 2px solid transparent;
        border-radius: 50%;
        margin-right: 8px;
        animation: spin 1s linear infinite;
      }

      .button-base.loading .spinner {
        display: inline-block;
      }

      /* Gutter Styles */
      .gutter {
        background-color: #eee;
        background-repeat: no-repeat;
        background-position: 50%;
      }

      .gutter.gutter-horizontal {
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAeCAYAAADkftS9AAAAIklEQVQoU2M4c+bMfxAGAgYYmwGrIIiDjrELjpo5aiZeMwF+yNnOs5KSvgAAAABJRU5ErkJggg==");
        cursor: col-resize;
        width: 8px;
      }

      .gutter.gutter-vertical {
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAFAQMAAABo7865AAAABlBMVEVHcEzMzMzyAv2sAAAAAXRSTlMAQObYZgAAABBJREFUeF5jOAMEEAIEEFwAn3kMwcB6I2AAAAAASUVORK5CYII=");
        cursor: row-resize;
        height: 8px;
      }

      /* Chat Message Styles */
      .message {
        margin-bottom: 0.5rem;
        padding: 0.5rem;
        border-radius: 0.375rem;
      }

      .bg-blue-50 {
        background-color: #eff6ff;
      }
      .bg-green-50 {
        background-color: #f0fdf4;
      }
      .bg-red-50 {
        background-color: #fef2f2;
      }
      .bg-yellow-50 {
        background-color: #fefce8;
      }
      .bg-gray-50 {
        background-color: #f9fafb;
      }

      /* Responsive Styles */
      @media (min-width: 1024px) {
        .split-horizontal > div:first-child {
          flex: 0 0 25%;
        }

        .split-horizontal > div:last-child {
          flex: 0 0 75%;
        }
      }

      @media (max-width: 768px) {
        .split-horizontal {
          flex-direction: column;
        }

        .gutter-horizontal {
          display: none;
        }

        .panel {
          min-height: 300px;
        }

        .monaco-editor {
          min-height: 300px !important;
        }

        .monaco-editor .overflow-guard {
          width: 100% !important;
        }
      }

      @media (max-width: 640px) {
        .layout-container {
          padding: 0.5rem;
        }

        .panel {
          margin: 0.125rem;
        }
      }
    </style>

    <!-- HTML -->
  </head>

  <body class="bg-gray-100">
    <div class="layout-container">
      <h1 class="text-2xl font-bold mb-4">AI Coding Sandbox</h1>

      <div class="split-horizontal">
        <!-- Left Panel Container -->

            </div>
<!-- Prompt Imput -->
<div class="mb-4">

</div>
            <!-- Prompt Selector -->

    <!-- JAVASCRIPT -->
    <script type="module">
      import { GoogleGenerativeAI } from "@google/generative-ai";
      import * as monaco from "monaco-editor";

      // First AI
      const genAI = new GoogleGenerativeAI(
        "REMOVED_GEMINI_KEY"
      );
      const model = genAI.getGenerativeModel({ model: "gemini-pro" });

      // Second AI
      const genAI2 = new GoogleGenerativeAI(
        "REMOVED_GEMINI_KEY"
      );
      const model2 = genAI2.getGenerativeModel({ model: "gemini-pro" });

      // Add AI roles
      const AI_ROLES = {
        ARCHITECT: "AI Architect",
        TESTER: "AI Tester", // Changed from ENHANCER to TESTER
      };

      let tokenUsage = 0;
      const tokenLimit = 10000;

     // Initialize Monaco Editor
const editor = monaco.editor.create(document.getElementById("editor"), {
    value: "<!-- AI-generated code will appear here -->",
    language: "html",
    theme: "vs-dark",
});

// Initialize Split.js for horizontal split (left and right panels)
const horizontalSplit = Split(['#left-pane', '#right-pane'], {
    sizes: [25, 75],
    minSize: [200, 400],
    gutterSize: 8,
    direction: 'horizontal',
    elementStyle: function (dimension, size, gutterSize) {
        return {
            'flex-basis': `calc(${size}% - ${gutterSize}px)`,
        }
    },
    gutterStyle: function (dimension, gutterSize) {
        return {
            'flex-basis': `${gutterSize}px`,
        }
    }
});

// Initialize Split.js for left vertical split (prompt and chat)
const leftVerticalSplit = Split([
    '#prompt-panel',
    '#chat-panel'
], {
    sizes: [30, 70],
    minSize: [100, 100],
    gutterSize: 8,
    direction: 'vertical',
    elementStyle: function (dimension, size, gutterSize) {
        return {
            'flex-basis': `calc(${size}% - ${gutterSize}px)`,
        }
    },
    gutterStyle: function (dimension, gutterSize) {
        return {
            'flex-basis': `${gutterSize}px`,
        }
    }
});

// Initialize Split.js for right vertical split (editor and preview)
const rightVerticalSplit = Split([
    '#editor-panel',
    '#preview-panel'
], {
    sizes: [50, 50],
    minSize: [100, 100],
    gutterSize: 8,
    direction: 'vertical',
    elementStyle: function (dimension, size, gutterSize) {
        return {
            'flex-basis': `calc(${size}% - ${gutterSize}px)`,
        }
    },
    gutterStyle: function (dimension, gutterSize) {
        return {
            'flex-basis': `${gutterSize}px`,
        }
    }
});

// Handle editor resize
const resizeObserver = new ResizeObserver(() => {
    if (editor) {
        editor.layout();
    }
});

resizeObserver.observe(document.getElementById('editor-panel'));
window.addEventListener('resize', () => {
    if (editor) {
        editor.layout();
    }
});

async function generateCode(customPrompt = null) {
        const generateBtn = document.getElementById("generate-btn");

        if (tokenUsage >= tokenLimit) {
          updateChat("System: Token limit reached for today!");
          return; 
        }

        generateBtn.classList.add("loading");
        generateBtn.disabled = true;

        const selectedPrompt = document.getElementById("prompt-selector").value;
        const baseStructure =
          "Important: Always provide a complete HTML document with <!DOCTYPE html>, <html>, <head> (including title), and <body> tags. Include all CSS within a <style> tag in the head section. Do not use separate CSS or code blocks - everything must be in a single, complete HTML file.";

        const architectPrompt = `You are an expert frontend architect. 
CRITICAL HTML RULES:
1. ALL interactive elements MUST have unique IDs
2. ALL elements referenced in JavaScript MUST have IDs
3. ALWAYS use semantic HTML elements (header, nav, main, footer)
4. ALL images MUST have alt attributes
5. ALWAYS add aria-labels for accessibility

CRITICAL CSS RULES:
1. ALL CSS properties must end with semicolons
2. ALL property values must have proper spacing (e.g., "margin: 0;")
3. NO extra spaces in property names (e.g., "background-color" NOT "background   color")
4. Use 2 spaces for indentation
5. Add transitions for interactive elements
6. Include hover states for clickable elements

CRITICAL JAVASCRIPT RULES:
1. ALWAYS wrap JavaScript code in an IIFE to prevent global scope pollution
2. ALWAYS check if elements exist before adding event listeners
3. Use const/let instead of var
4. Add error handling for DOM operations
5. Use proper event delegation when needed
6. Include console warnings for potential issues

BEFORE WRITING CODE:
1. First describe your planned approach in bullet points
2. Then provide the complete code following the rules above

CORRECT EXAMPLES:
CSS:
.example {
 color: #fff;
 background-color: #000;
 margin: 0 auto;
 padding: 20px;
}

JavaScript:
 (function() {
      const button = document.getElementById('myButton');
      if (!button) {
        console.warn('Button element not found');
        return;
      }
      
      button.addEventListener('click', () => {
        try {
          // Your code here
        } catch (error) {
          console.error('Error:', error);
        }
      });
    })();

${baseStructure}`;

        const testerPrompt = `You are an expert frontend QA tester.
YOUR ROLE:
1. Review and validate the provided code
2. DO NOT modify the code
3. Test all functionality and features
4. Verify code formatting and structure
5. Check for potential issues or bugs

PRE-EXECUTION CHECKS:
1. Verify all JavaScript-referenced elements have IDs
2. Confirm all interactive elements have proper attributes
3. Check for proper IIFE usage in scripts
4. Verify error handling presence
5. Check for proper event listener implementations

TEST CASES MUST COVER:
1. HTML Structure:
   • All required IDs present
   • Semantic HTML usage
   • Accessibility attributes
   • Proper nesting

2. CSS Validation:
   • All properties properly formatted
   • Transitions defined
   • Hover states present
   • Responsive design

3. JavaScript Validation:
   • IIFE implementation
   • Error handling
   • Event listener checks
   • Console warnings

4. Interaction Testing:
   • Click events
   • Hover states
   • Transitions
   • Error scenarios

PROVIDE YOUR RESPONSE IN THIS FORMAT:
- Structure Validation:
  ✓ Required IDs: All present
  ✓ Semantic HTML: Properly used
  ! Warning: Missing aria-label on button

- Functionality Testing:
  ✓ Click events: Working
  ✓ Transitions: Smooth
  ! Note: Consider adding loading states

Return a detailed report of all tests performed.`;

        function validateCode(code) {
          return code
            .replace(/\s+;/g, ";") // Remove spaces before semicolons
            .replace(/:\s+/g, ": ") // Ensure single space after colons
            .replace(/\s{2,}/g, " ") // Remove multiple spaces
            .replace(/{\s+}/g, "{}") // Fix empty blocks
            .replace(/(\w+)\s+:/g, "$1:") // Remove spaces before colons
            .replace(/\(\s+/g, "(") // Remove spaces after opening parentheses
            .replace(/\s+\)/g, ")") // Remove spaces before closing parentheses
            .replace(/\s+{/g, " {") // Ensure single space before opening braces
            .replace(/}\s+/g, "}\n") // Ensure newline after closing braces
            .replace(/:\s*([^;\n{}]+?)\s*([;}])/g, ": $1$2") // Fix property value spacing
            .replace(
              /([a-z-]+)\s*:\s*([^;}]+)[;}]/g,
              (match, prop, value) => `${prop}: ${value.trim()};`
            );
        }

        try {
          let initialResponse;

          // Handle custom prompt or use dropdown selection
          if (customPrompt) {
            updateChat(`${AI_ROLES.ARCHITECT}: Processing custom prompt: "${customPrompt}"`);
            const chat1 = await model.startChat({ history: [] });
            const result1 = await chat1.sendMessage([{
                text: `${architectPrompt} Create code for the following request: ${customPrompt}`
            }]);
            initialResponse = await result1.response.text();

            // Extract and display Architect's plan for custom prompt
            const architectFeatures = initialResponse
                .split('\n')
                .filter(line => line.trim().startsWith('*') || line.trim().startsWith('-') || line.trim().startsWith('•'))
                .map(line => line.trim());
            if (architectFeatures.length > 0) {
                updateChat(`${AI_ROLES.ARCHITECT}: Here's my approach to your custom request:\n${architectFeatures.join('\n')}`);
            }
          } else if (selectedPrompt === "self-improve") {
            updateChat(`${AI_ROLES.ARCHITECT}: Analyzing the existing code...`);
            const chat1 = await model.startChat({ history: [] });
            const result1 = await chat1.sendMessage([
              {
                text: `${architectPrompt}
                     Analyze this code and suggest improvements. List your analysis in bullet points before providing the improved code:
                     ${editor.getValue()}`,
              },
            ]);
            const analysis = await result1.response.text();

            // Extract bullet points and add to chat
            const bulletPoints = analysis.match(/[•\-\*].+/g);
            if (bulletPoints) {
              updateChat(
                `${
                  AI_ROLES.ARCHITECT
                }: Here are my suggested improvements:\n${bulletPoints.join(
                  "\n"
                )}`
              );
            }

            initialResponse = analysis;
          } else {
            updateChat(`${AI_ROLES.ARCHITECT}: Creating initial solution...`);
            const chat1 = await model.startChat({ history: [] });
            const promptText =
              selectedPrompt === "freestyle"
                ? `${architectPrompt} Create something creative and unique using HTML, CSS, and JavaScript.`
                : `${architectPrompt} ${
                    document.getElementById("prompt-selector")
                      .selectedOptions[0].text
                  }`;

            const result1 = await chat1.sendMessage([{ text: promptText }]);
            initialResponse = await result1.response.text();

            // Extract and display Architect's plan
            const architectFeatures = initialResponse
              .split("\n")
              .filter(
                (line) =>
                  line.trim().startsWith("*") ||
                  line.trim().startsWith("-") ||
                  line.trim().startsWith("•")
              )
              .map((line) => line.trim());
            if (architectFeatures.length > 0) {
              updateChat(
                `${
                  AI_ROLES.ARCHITECT
                }: Here's my planned approach:\n${architectFeatures.join("\n")}`
              );
            } else {
              // Try to extract comments if no bullet points found
              const comments = initialResponse.match(
                /\/\*[\s\S]*?\*\/|\/\/.+/g
              );
              if (comments) {
                updateChat(
                  `${
                    AI_ROLES.ARCHITECT
                  }: Here's my planned approach:\n${comments.join("\n")}`
                );
              }
            }
          }

          // Second AI (Tester) validates the solution
          updateChat(
            `${AI_ROLES.TESTER}: Beginning code validation and testing...`
          );
          const chat2 = await model2.startChat({ history: [] });
          const result2 = await chat2.sendMessage([
            {
              text: `${testerPrompt}
                 Test this code thoroughly and provide your analysis:
                 ${initialResponse}`,
            },
          ]);
          const testResponse = await result2.response.text();

          // Extract test results for chat
          const testResults = testResponse.match(
            /[•✓!][\s\S]+?(?=\n[•✓!]|\n\n|$)/g
          );
          if (testResults) {
            updateChat(
              `${AI_ROLES.TESTER}: Test Results:\n${testResults.join("\n")}`
            );
          }

          // Use the original code since tester doesn't modify it
          let finalCode = validateCode(initialResponse);

          // Extract just the HTML code if it's mixed with comments
          const htmlMatch = finalCode.match(/<(!DOCTYPE|html)[\s\S]+<\/html>/i);
          if (htmlMatch) {
            finalCode = validateCode(htmlMatch[0]);
          }

          if (!finalCode.trim().toLowerCase().startsWith("<!doctype html>")) {
            finalCode = `<!DOCTYPE html>
<html>
<head>
 <title>Generated Code</title>
 <style>
   body {
     margin: 0;
     padding: 20px;
     min-height: 100vh;
     display: flex;
     justify-content: center;
     align-items: center;
   }
 </style>
</head>
<body>
${finalCode}
</body>
</html>`;
          }

          // Add debug checks before setting the code
          const debugIssues = debugCode(finalCode);

          if (debugIssues.length > 0) {
            updateChat("🔍 Debug Results:");
            debugIssues.forEach((issue) => {
              const icon =
                issue.type === "error"
                  ? "❌"
                  : issue.type === "warning"
                  ? "⚠️"
                  : "ℹ️";
              updateChat(
                `${icon} ${issue.type.toUpperCase()}: ${
                  issue.message
                }\n   💡 Suggestion: ${issue.suggestion}`
              );
            });
          }

          if (debugIssues.some((issue) => issue.type === "error")) {
            updateChat(
              "System: ⚠️ Critical issues found in generated code. Please review debug results."
            );
          } else if (debugIssues.length > 0) {
            updateChat(
              "System: Code generated with some suggestions for improvement."
            );
          } else {
            updateChat("System: Code passes all debug checks! ✅");
          }

          editor.setValue(validateCode(finalCode));
          updateChat(
            "System: Code generation and testing complete! Run it to see the results."
          );
          tokenUsage += 400;
          document.getElementById("token-count").innerText = tokenUsage;
        } catch (error) {
          console.error("Error in AI collaboration:", error);
          updateChat("System: An error occurred during code generation.");
        } finally {
          generateBtn.classList.remove("loading");
          generateBtn.disabled = false;
        }
      }

      function debugCode(code) {
        const issues = [];

        // Check for HTML issues
        if (code.includes("getElementById") && !code.includes('id="')) {
          issues.push({
            type: "error",
            message:
              "JavaScript references ID but no matching ID attribute found",
            suggestion:
              "Add missing ID attributes to elements referenced in JavaScript",
          });
        }

        // Check for JavaScript issues
        if (!code.includes("(function()") && code.includes("<script>")) {
          issues.push({
            type: "warning",
            message: "JavaScript not wrapped in IIFE",
            suggestion:
              "Wrap JavaScript code in (function() { ... })(); to prevent scope issues",
          });
        }

        if (code.includes("addEventListener") && !code.includes("try {")) {
          issues.push({
            type: "warning",
            message: "Missing error handling in event listeners",
            suggestion: "Add try-catch blocks around event listener code",
          });
        }

        // Check for CSS issues
        if (
          code.includes("style") &&
          code.includes("{") &&
          !code.includes("transition")
        ) {
          issues.push({
            type: "info",
            message: "Interactive elements missing transitions",
            suggestion: "Add CSS transitions for smoother interactions",
          });
        }

        // Check for accessibility
        if (code.includes("<button") && !code.includes("aria-label")) {
          issues.push({
            type: "warning",
            message: "Button missing accessibility attributes",
            suggestion: "Add aria-label to buttons for screen readers",
          });
        }

        // Check for semantic HTML
        if (
          !code.includes("<header") &&
          !code.includes("<main") &&
          !code.includes("<footer")
        ) {
          issues.push({
            type: "info",
            message: "Missing semantic HTML elements",
            suggestion:
              "Use semantic elements like <header>, <main>, and <footer>",
          });
        }

        return issues;
      }

      async function runCode() {
        const runBtn = document.getElementById("run-btn");

        // Add loading state
        runBtn.classList.add("loading");
        runBtn.disabled = true;

        try {
          const code = editor.getValue();
          const iframe =
            document.getElementById("preview").contentWindow.document;
          iframe.open();
          iframe.write(code);
          iframe.close();

          // Add a small delay to show the loading state
          await new Promise((resolve) => setTimeout(resolve, 500));
        } finally {
          // Remove loading state
          runBtn.classList.remove("loading");
          runBtn.disabled = false;
        }
      }
      async function clearEditor() {
        const clearBtn = document.getElementById("clear-btn");

        clearBtn.classList.add("loading");
        clearBtn.disabled = true;

        editor.setValue("");
        document.getElementById("preview").contentWindow.document.open();
        document.getElementById("preview").contentWindow.document.write("");
        document.getElementById("preview").contentWindow.document.close();

        setTimeout(() => {
          clearBtn.classList.remove("loading");
          clearBtn.disabled = false;
        }, 300);
      }

      function updateChat(message) {
        const chatDiv = document.getElementById("ai-chat");
        const messageElement = document.createElement("div");
        messageElement.className = "mb-2 p-2 rounded";

        // Style based on who's speaking
        if (message.includes(AI_ROLES.ARCHITECT)) {
          messageElement.className += " bg-blue-50";
        } else if (message.includes(AI_ROLES.TESTER)) {
          messageElement.className += " bg-green-50";
        } else if (message.includes("❌")) {
          // Error messages
          messageElement.className += " bg-red-50";
        } else if (message.includes("⚠️")) {
          // Warning messages
          messageElement.className += " bg-yellow-50";
        } else if (message.includes("ℹ️")) {
          // Info messages
          messageElement.className += " bg-gray-50";
        } else {
          messageElement.className += " bg-gray-50";
        }

        // Format bullet points and debug messages with proper spacing
        message = message.replace(/\n/g, "<br>");
        message = message.replace(/💡 Suggestion:/g, "<br>💡 Suggestion:");
        messageElement.innerHTML = message;
        chatDiv.appendChild(messageElement);
        chatDiv.scrollTop = chatDiv.scrollHeight;
      }

      document.getElementById("custom-prompt-btn").addEventListener("click", () => {
            const customPrompt = document.getElementById("custom-prompt").value.trim();
            if (customPrompt) {
                generateCode(customPrompt);
                document.getElementById("custom-prompt").value = ''; // Clear after submission
            }
        });

        document.getElementById("custom-prompt").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const customPrompt = e.target.value.trim();
                if (customPrompt) {
                    generateCode(customPrompt);
                    e.target.value = ''; // Clear after submission
                }
            }
        });

      document
        .getElementById("generate-btn")
        .addEventListener("click", generateCode);
      document.getElementById("run-btn").addEventListener("click", runCode);
      document
        .getElementById("clear-btn")
        .addEventListener("click", clearEditor);
        
    </script>
  </body>
</html>

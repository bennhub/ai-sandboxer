<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Coding Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai",
          "monaco-editor": "https://esm.run/monaco-editor"
        }
      }
    </script>

    <style>
        .button-base {
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .button-base:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .button-base:active {
            transform: translateY(0px) scale(0.98);
        }

        .button-base:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            margin-right: 8px;
            animation: spin 1s linear infinite;
        }

        .button-base.loading .spinner {
            display: inline-block;
        }

        /* Editor and Preview Styles */
        #editor {
            min-height: 400px;
            height: calc(50vh - 2rem);
            max-height: 800px;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        #preview {
            min-height: 400px;
            height: calc(50vh - 2rem);
            max-height: 800px;
            border-radius: 0.5rem;
            border: 2px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: white;
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {

            #editor,
            #preview {
                height: calc(60vh - 2rem);
                max-height: 1000px;
            }
        }

        @media (max-width: 640px) {

            #editor,
            #preview {
                min-height: 300px;
                height: calc(40vh - 1rem);
            }

            .monaco-editor {
                min-height: 300px !important;
            }

            .monaco-editor .overflow-guard {
                width: 100% !important;
            }

            .container {
                padding-left: 8px;
                padding-right: 8px;
            }
        }
    </style>
</head>
<!-- HTML -->
<body class="bg-gray-100 p-3 md:p-6">
    <div class="container mx-auto px-4 max-w-full md:max-w-7xl">
        <h1 class="text-2xl font-bold mb-4">AI Coding Sandbox</h1>

        <!-- AI Chat Output -->
      
        <div id="ai-chat" class="bg-white p-3 md:p-4 rounded-lg shadow mb-3 md:mb-4 h-48 md:h-56 overflow-y-auto">
            <p class="text-gray-600">System: AI collaboration ready to begin...</p>
        </div>

        <!-- Prompt Selector -->
        <select id="prompt-selector" class="w-full mb-3 md:mb-4 p-2 rounded border">
            <optgroup label="HTML/CSS">
                <option value="hover">
                    Create a button with a cool hover effect
                </option>
                <option value="loading">
                    Generate a smooth loading animation using CSS
                </option>
                <option value="glitch">
                    Make a text effect that looks like it's glitching
                </option>
                <option value="neon">Design a glowing neon text effect</option>
                <option value="kinetic-typography">
                    Kinetic Typography: Animate text dynamically using CSS
                </option>
                <option value="interactive-svg">Interactive SVG Illustrations</option>
                <option value="responsive-grids">Responsive Text Grids</option>
                <option value="color-palettes">Customizable Color Palettes</option>
            </optgroup>

            <optgroup label="JavaScript">
                <option value="bounce">Create a bouncing ball animation</option>
                <option value="procedural-art">Procedural Art Generator</option>
                <option value="audio-visualizer">Interactive Audio Visualizer</option>
                <option value="particle-system">Canvas-based Particle Systems</option>
                <option value="webgl-scene">WebGL-powered 3D Scene</option>
                <option value="chatbot">Interactive Chatbot</option>
            </optgroup>

            <optgroup label="HTML/CSS/JavaScript">
                <option value="parallax">Parallax Scrolling Effect</option>
                <option value="data-visualization">
                    Interactive Data Visualizations
                </option>
                <option value="stop-motion">Animated Stop-Motion Stories</option>
                <option value="navigation-experience">
                    Personalized Navigation Experiences
                </option>
                <option value="quizzes-puzzles">Gamified Quizzes and Puzzles</option>
                <option value="whiteboard">Collaborative Whiteboard</option>
                <option value="audio-player">Create a cool audio player</option>
            </optgroup>

            <optgroup label="Other">
                <option value="self-improve">
                    Analyze and improve the last code snippet you generated
                </option>
                <option value="freestyle">
                    Freestyle - Generate any creative frontend code
                </option>
            </optgroup>
        </select>

        <!-- Code Editor -->
        <div id="editor" class="w-full border rounded mb-3 md:mb-4"></div>

        <!-- Live Preview -->
        <iframe id="preview" class="w-full border rounded bg-white mb-3 md:mb-4"></iframe>

        <!-- Controls -->
        <div class="flex flex-col sm:flex-row gap-2 sm:gap-4 mt-3 md:mt-4">
            <button id="generate-btn"
                class="button-base bg-blue-500 text-white px-4 py-2 rounded flex items-center justify-center">
                <span class="spinner"></span>
                <span class="button-text">Generate Code</span>
            </button>
            <button id="run-btn"
                class="button-base bg-green-500 text-white px-4 py-2 rounded flex items-center justify-center">
                <span class="spinner"></span>
                <span class="button-text">Run Code</span>
            </button>
            <button id="clear-btn"
                class="button-base bg-gray-500 text-white px-4 py-2 rounded flex items-center justify-center">
                <span class="spinner"></span>
                <span class="button-text">Clear</span>
            </button>
        </div>

        <!-- Token Tracker -->
        <div class="mt-3 md:mt-4 text-sm text-gray-700">
            Tokens Used: <span id="token-count">0</span> / 10000
        </div>
    </div>
    <!-- JAVASCRIPT --> 
    <script type="module">
    import { GoogleGenerativeAI } from '@google/generative-ai';
    import * as monaco from 'monaco-editor';

    // First AI
    const genAI = new GoogleGenerativeAI("REMOVED_GEMINI_KEY");
    const model = genAI.getGenerativeModel({ model: "gemini-pro" });

    // Second AI
    const genAI2 = new GoogleGenerativeAI("REMOVED_GEMINI_KEY");
    const model2 = genAI2.getGenerativeModel({ model: "gemini-pro" });

        // Add AI roles
        const AI_ROLES = {
    ARCHITECT: "AI Architect",
    TESTER: "AI Tester"  // Changed from ENHANCER to TESTER
};

        let tokenUsage = 0;
        const tokenLimit = 10000;

        // Initialize Monaco Editor
        const editor = monaco.editor.create(document.getElementById("editor"), {
            value: "<!-- AI-generated code will appear here -->",
            language: "html",
            theme: "vs-dark",
        });

        // Handle editor resize
        window.addEventListener("resize", () => {
            if (editor) {
                editor.layout();
            }
        });

        async function generateCode() {
   const generateBtn = document.getElementById("generate-btn");

   if (tokenUsage >= tokenLimit) {
       updateChat("System: Token limit reached for today!");
       return;
   }

   generateBtn.classList.add("loading");
   generateBtn.disabled = true;

   const selectedPrompt = document.getElementById("prompt-selector").value;
   const baseStructure = "Important: Always provide a complete HTML document with <!DOCTYPE html>, <html>, <head> (including title), and <body> tags. Include all CSS within a <style> tag in the head section. Do not use separate CSS or code blocks - everything must be in a single, complete HTML file.";

   const architectPrompt = `You are an expert frontend architect. 
CRITICAL HTML RULES:
1. ALL interactive elements MUST have unique IDs
2. ALL elements referenced in JavaScript MUST have IDs
3. ALWAYS use semantic HTML elements (header, nav, main, footer)
4. ALL images MUST have alt attributes
5. ALWAYS add aria-labels for accessibility

CRITICAL CSS RULES:
1. ALL CSS properties must end with semicolons
2. ALL property values must have proper spacing (e.g., "margin: 0;")
3. NO extra spaces in property names (e.g., "background-color" NOT "background   color")
4. Use 2 spaces for indentation
5. Add transitions for interactive elements
6. Include hover states for clickable elements

CRITICAL JAVASCRIPT RULES:
1. ALWAYS wrap JavaScript code in an IIFE to prevent global scope pollution
2. ALWAYS check if elements exist before adding event listeners
3. Use const/let instead of var
4. Add error handling for DOM operations
5. Use proper event delegation when needed
6. Include console warnings for potential issues

BEFORE WRITING CODE:
1. First describe your planned approach in bullet points
2. Then provide the complete code following the rules above

CORRECT EXAMPLES:
CSS:
.example {
 color: #fff;
 background-color: #000;
 margin: 0 auto;
 padding: 20px;
}

JavaScript:
 (function() {
      const button = document.getElementById('myButton');
      if (!button) {
        console.warn('Button element not found');
        return;
      }
      
      button.addEventListener('click', () => {
        try {
          // Your code here
        } catch (error) {
          console.error('Error:', error);
        }
      });
    })();

${baseStructure}`;

   const testerPrompt = `You are an expert frontend QA tester.
YOUR ROLE:
1. Review and validate the provided code
2. DO NOT modify the code
3. Test all functionality and features
4. Verify code formatting and structure
5. Check for potential issues or bugs

PRE-EXECUTION CHECKS:
1. Verify all JavaScript-referenced elements have IDs
2. Confirm all interactive elements have proper attributes
3. Check for proper IIFE usage in scripts
4. Verify error handling presence
5. Check for proper event listener implementations

TEST CASES MUST COVER:
1. HTML Structure:
   • All required IDs present
   • Semantic HTML usage
   • Accessibility attributes
   • Proper nesting

2. CSS Validation:
   • All properties properly formatted
   • Transitions defined
   • Hover states present
   • Responsive design

3. JavaScript Validation:
   • IIFE implementation
   • Error handling
   • Event listener checks
   • Console warnings

4. Interaction Testing:
   • Click events
   • Hover states
   • Transitions
   • Error scenarios

PROVIDE YOUR RESPONSE IN THIS FORMAT:
- Structure Validation:
  ✓ Required IDs: All present
  ✓ Semantic HTML: Properly used
  ! Warning: Missing aria-label on button

- Functionality Testing:
  ✓ Click events: Working
  ✓ Transitions: Smooth
  ! Note: Consider adding loading states

Return a detailed report of all tests performed.`;

   function validateCode(code) {
       return code
           .replace(/\s+;/g, ';') // Remove spaces before semicolons
           .replace(/:\s+/g, ': ') // Ensure single space after colons
           .replace(/\s{2,}/g, ' ') // Remove multiple spaces
           .replace(/{\s+}/g, '{}') // Fix empty blocks
           .replace(/(\w+)\s+:/g, '$1:') // Remove spaces before colons
           .replace(/\(\s+/g, '(') // Remove spaces after opening parentheses
           .replace(/\s+\)/g, ')') // Remove spaces before closing parentheses
           .replace(/\s+{/g, ' {') // Ensure single space before opening braces
           .replace(/}\s+/g, '}\n') // Ensure newline after closing braces
           .replace(/:\s*([^;\n{}]+?)\s*([;}])/g, ': $1$2') // Fix property value spacing
           .replace(/([a-z-]+)\s*:\s*([^;}]+)[;}]/g, (match, prop, value) => `${prop}: ${value.trim()};`);
   }

   try {
       let initialResponse;

       // First AI (Architect) generates base code
       if (selectedPrompt === "self-improve") {
           updateChat(`${AI_ROLES.ARCHITECT}: Analyzing the existing code...`);
           const chat1 = await model.startChat({ history: [] });
           const result1 = await chat1.sendMessage([{
               text: `${architectPrompt}
                     Analyze this code and suggest improvements. List your analysis in bullet points before providing the improved code:
                     ${editor.getValue()}`
           }]);
           const analysis = await result1.response.text();
           
           // Extract bullet points and add to chat
           const bulletPoints = analysis.match(/[•\-\*].+/g);
           if (bulletPoints) {
               updateChat(`${AI_ROLES.ARCHITECT}: Here are my suggested improvements:\n${bulletPoints.join('\n')}`);
           }
           
           initialResponse = analysis;
       } else {
           updateChat(`${AI_ROLES.ARCHITECT}: Creating initial solution...`);
           const chat1 = await model.startChat({ history: [] });
           const promptText = selectedPrompt === "freestyle" 
               ? `${architectPrompt} Create something creative and unique using HTML, CSS, and JavaScript.`
               : `${architectPrompt} ${document.getElementById("prompt-selector").selectedOptions[0].text}`;
           
           const result1 = await chat1.sendMessage([{ text: promptText }]);
           initialResponse = await result1.response.text();
           
           // Extract and display Architect's plan
           const architectFeatures = initialResponse.split('\n')
               .filter(line => line.trim().startsWith('*') || line.trim().startsWith('-') || line.trim().startsWith('•'))
               .map(line => line.trim());
           if (architectFeatures.length > 0) {
               updateChat(`${AI_ROLES.ARCHITECT}: Here's my planned approach:\n${architectFeatures.join('\n')}`);
           } else {
               // Try to extract comments if no bullet points found
               const comments = initialResponse.match(/\/\*[\s\S]*?\*\/|\/\/.+/g);
               if (comments) {
                   updateChat(`${AI_ROLES.ARCHITECT}: Here's my planned approach:\n${comments.join('\n')}`);
               }
           }
       }

       // Second AI (Tester) validates the solution
       updateChat(`${AI_ROLES.TESTER}: Beginning code validation and testing...`);
       const chat2 = await model2.startChat({ history: [] });
       const result2 = await chat2.sendMessage([{
           text: `${testerPrompt}
                 Test this code thoroughly and provide your analysis:
                 ${initialResponse}`
       }]);
       const testResponse = await result2.response.text();

       // Extract test results for chat
       const testResults = testResponse.match(/[•✓!][\s\S]+?(?=\n[•✓!]|\n\n|$)/g);
       if (testResults) {
           updateChat(`${AI_ROLES.TESTER}: Test Results:\n${testResults.join('\n')}`);
       }

       // Use the original code since tester doesn't modify it
       let finalCode = validateCode(initialResponse);

       // Extract just the HTML code if it's mixed with comments
       const htmlMatch = finalCode.match(/<(!DOCTYPE|html)[\s\S]+<\/html>/i);
       if (htmlMatch) {
           finalCode = validateCode(htmlMatch[0]);
       }
       
       if (!finalCode.trim().toLowerCase().startsWith('<!doctype html>')) {
           finalCode = `<!DOCTYPE html>
<html>
<head>
 <title>Generated Code</title>
 <style>
   body {
     margin: 0;
     padding: 20px;
     min-height: 100vh;
     display: flex;
     justify-content: center;
     align-items: center;
   }
 </style>
</head>
<body>
${finalCode}
</body>
</html>`;
       }

       editor.setValue(validateCode(finalCode));
       updateChat("System: Code generation and testing complete! Run it to see the results.");
       tokenUsage += 400;
       document.getElementById("token-count").innerText = tokenUsage;

   } catch (error) {
       console.error("Error in AI collaboration:", error);
       updateChat("System: An error occurred during code generation.");
   } finally {
       generateBtn.classList.remove("loading");
       generateBtn.disabled = false;
   }
}
async function runCode() {
    const runBtn = document.getElementById("run-btn");
    
    // Add loading state
    runBtn.classList.add("loading");
    runBtn.disabled = true;
    
    try {
        const code = editor.getValue();
        const iframe = document.getElementById("preview").contentWindow.document;
        iframe.open();
        iframe.write(code);
        iframe.close();
        
        // Add a small delay to show the loading state
        await new Promise(resolve => setTimeout(resolve, 500));
    } finally {
        // Remove loading state
        runBtn.classList.remove("loading");
        runBtn.disabled = false;
    }
}
        async function clearEditor() {
            const clearBtn = document.getElementById("clear-btn");

            clearBtn.classList.add("loading");
            clearBtn.disabled = true;

            editor.setValue("");
            document.getElementById("preview").contentWindow.document.open();
            document.getElementById("preview").contentWindow.document.write("");
            document.getElementById("preview").contentWindow.document.close();

            setTimeout(() => {
                clearBtn.classList.remove("loading");
                clearBtn.disabled = false;
            }, 300);
        }

        function updateChat(message) {
    const chatDiv = document.getElementById("ai-chat");
    const messageElement = document.createElement('div');
    messageElement.className = 'mb-2 p-2 rounded';
    
    // Style based on who's speaking
    if (message.includes(AI_ROLES.ARCHITECT)) {
        messageElement.className += ' bg-blue-50';
    } else if (message.includes(AI_ROLES.ENHANCER)) {
        messageElement.className += ' bg-green-50';
    } else {
        messageElement.className += ' bg-gray-50';
    }
    
    // Format bullet points with proper spacing
    message = message.replace(/\n/g, '<br>');
    messageElement.innerHTML = message;
    chatDiv.appendChild(messageElement);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

        document
            .getElementById("generate-btn")
            .addEventListener("click", generateCode);
        document.getElementById("run-btn").addEventListener("click", runCode);
        document
            .getElementById("clear-btn")
            .addEventListener("click", clearEditor);
    </script>
</body>

</html>

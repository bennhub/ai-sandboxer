<!-- Glowing text effect-->
<!DOCTYPE html>
<html>
<head>
  <title>Glowing Neon Text Effect</title>
  <style>
    body {
      background-color: #000;
    }

    .neon-text {
      font-family: 'Arial', sans-serif;
      font-size: 50px;
      color: #fff;
      text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000, 0 0 40px #ff0000, 0 0 50px #ff0000, 0 0 60px #ff0000, 0 0 70px #ff0000;
    }
  </style>
</head>
<body>
  <div class="neon-text">
    Glowing Neon Text
  </div>

 
<button id="cool-button">Hover Me!</button>


<style>
#cool-button {
  border: none;
  background-color: #000;
  color: #fff;
  padding: 10px 20px;
  text-transform: uppercase;
  transition: all 0.3s ease-in-out;
}

#cool-button:hover {
  background-color: #fff;
  color: #000;
  border: 1px solid #000;
}
</style>

</body>
</html>
